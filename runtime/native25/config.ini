# RED4ext config for the native macOS loader on game 2.5 (installed by NightCity Console).
# strict_version_check: the loader refuses to start on any build its address database was not made for.

version = 0

[dev]
console = false
wait_for_debugger = false
strict_version_check = true

[logging]
flush_on = "info"
level = "info"
max_file_size = 10
max_files = 5

[plugins]
enabled = true
ignored = []

[hooking]
# Core hooks besides main(): only the one exercised by the 2.5 test runs. NightCity compiles scripts itself
# (scc), so the script-loading hooks are not needed.
core_hooks = ["CGameApplication_AddState"]
